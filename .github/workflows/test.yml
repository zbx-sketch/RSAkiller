name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpc-dev
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Run deterministic regression tests
        run: >-
          python -m pytest -q
          tests/test_ctf_solver.py
          tests/test_web.py
          tests/test_explicit_timeout.py
          tests/test_audit_regressions.py
